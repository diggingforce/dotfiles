[main]
font=Maple Mono:weight=bold:size=11
pad=2x2
dpi-aware=no

[tweak]
font-monospace-warn=no

[cursor]
style=beam
blink=no

[scrollback]
indicator-position=none

[colors-dark]
background=191919
foreground=d9d7d6
selection-background=ffffff
selection-foreground=191919

regular0=2e2e2e  # black
regular1=888888  # red
regular2=dddddd  # green
regular3=d9d7d6  # yellow
regular4=cccccc  # blue
regular5=888888  # magenta
regular6=e5e5e5  # cyan
regular7=dddddd  # white

bright0=444444   # bright black
bright1=999999   # bright red
bright2=ffffff   # bright green
bright3=d9d7d6   # bright yellow
bright4=cccccc   # bright blue
bright5=999999   # bright magenta
bright6=e5e5e5   # bright cyan
bright7=ffffff   # bright white
