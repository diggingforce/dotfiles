[bar.default]
background_opacity = 0.98999997787177563
capsule_thickness = 0.72999998740851879
center = [ "active_window" ]
end = [ "tray", "cpu", "sysmon", "notifications", "volume", "session" ]
font_family = "Ubuntu"
font_weight = 600
hover_highlight = false
margin_edge = 2
margin_ends = 500
padding = 10
radius = 19
scale = 0.90000000596046448
start = [ "workspaces", "clock", "media" ]
thickness = 33
widget_spacing = 10

[calendar]
enabled = true

[location]
address = "lahore"
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
avatar_path = "/home/huraira/Downloads/79788381.png"
font_family = "JetBrainsMono NF"
settings_show_advanced = true

    [shell.panel]
    floating_offset = 3

[theme]
builtin = "Noctalia"
community_palette = "Monochrome"
mode = "dark"
source = "community"
wallpaper_scheme = "soft"

[wallpaper]
directory = "/home/huraira/Pictures/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/huraira/Pictures/wallpapers/wallhaven-6kv9ww_1920x1080 (1).png"

    [wallpaper.last]
    path = "/home/huraira/Pictures/wallpapers/wallhaven-6kv9ww_1920x1080 (1).png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/huraira/Pictures/wallpapers/wallhaven-6kv9ww_1920x1080 (1).png"

[widget.active_window]
color = "error"
display = "text_only"

[widget.clock]
color = "tertiary"
enabled = true
format = "{:%I:%M %p}"

[widget.cpu]
color = "error"
highlight_color = "secondary"
scale = 1.1000000000000001
show_label = false

[widget.media]
art_size = 19
hide_when_no_media = true
max_length = 151
title_scroll = "on_hover"

[widget.notifications]
color = "error"

[widget.session]
color = "tertiary"
custom_image = "/usr/share/noctalia/assets/images/distros/cachy.svg"
custom_image_colorize = true
icon_color = "tertiary"
scale = 1.1500000000000001

[widget.sysmon]
color = "error"
highlight_color = "secondary"
scale = 1.05
show_label = false
stat = "cpu_temp"

[widget.tray]
color = "error"
drawer = true
drawer_item_size = 15.0
scale = 0.75

[widget.volume]
color = "error"
mute_color = "secondary"
scale = 1.05
show_label = false

[widget.workspaces]
active_pill_size = 2.4500000000000002
empty_color = "primary"
focused_color = "tertiary"
hide_when_empty = true
inactive_pill_size = 1.05
occupied_color = "tertiary"
pill_scale = 0.80000000000000004
scale = 0.94999999999999996
